[global]
   workgroup = WORKGROUP
   server string = Home Cloud
   server role = standalone server
   server min protocol = SMB3
   map to guest = never
   disable netbios = yes
   smb ports = 445
   log file = /var/log/samba/%m.log
   max log size = 1000
   # Compatibilite iPhone / Mac (app Fichiers)
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[photos]
   path = /srv/photos
   valid users = anto
   read only = no
   create mask = 0644
   directory mask = 0755

[films]
   path = /srv/films
   valid users = anto
   read only = no
   create mask = 0644
   directory mask = 0755

[papiers]
   path = /srv/papiers
   valid users = anto
   read only = no
   create mask = 0600
   directory mask = 0700
   server smb encrypt = desired
   veto files = /*.exe/*.bat/*.cmd/*.com/*.scr/*.js/*.vbs/*.ps1/*.msi/
   delete veto files = no
