arch: amd64
cores: 1
features: nesting=1
hostname: partage
memory: 512
mp0: /mnt/wd/photos,mp=/srv/photos
mp1: /mnt/wd/films,mp=/srv/films
net0: name=eth0,bridge=vmbr0,firewall=0,hwaddr=BC:24:11:XX:XX:XX,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-101-disk-0,size=4G
startup: order=1
swap: 256
timezone: host
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
