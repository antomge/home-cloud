arch: amd64
cores: 4
description: Immich %3A galerie photos + recherche intelligente (mod%C3%A8le multilingue). Cr%C3%A9%C3%A9 par creer-immich.sh%0A
features: nesting=1,keyctl=1
hostname: immich
memory: 7168
mp0: /mnt/wd/photos,mp=/mnt/photos,ro=1
mp1: /mnt/wd/immich,mp=/srv/immich
net0: name=eth0,bridge=vmbr0,hwaddr=BC:24:11:XX:XX:XX,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-103-disk-0,size=24G
startup: order=3
swap: 1024
timezone: Europe/Paris
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
