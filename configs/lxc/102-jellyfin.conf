arch: amd64
cores: 4
dev0: /dev/dri/renderD128,gid=992
features: nesting=1
hostname: jellyfin
memory: 3072
mp0: /mnt/wd/films,mp=/media/films,ro=1
mp1: /mnt/wd/transcodage-jellyfin,mp=/transcodage
net0: name=eth0,bridge=vmbr0,firewall=0,hwaddr=BC:24:11:XX:XX:XX,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-102-disk-0,size=16G
startup: order=2
swap: 512
timezone: host
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
