arch: amd64
cores: 1
description: Bloqueur de publicites (AdGuard Home) pour les appareils Tailscale%0A
features: nesting=1
hostname: adguard
memory: 512
net0: name=eth0,bridge=vmbr0,hwaddr=BC:24:11:XX:XX:XX,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-100-disk-0,size=4G
startup: order=1
swap: 256
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
